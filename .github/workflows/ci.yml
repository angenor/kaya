name: CI

# Filtrage par chemins — une modification de `docs/` seule ne déclenche pas la construction du
# backend. Le calcul est fait par un job dédié plutôt que par une action tierce : la porte P-20
# n'accepte aucune dépendance en intervalle, et une action non épinglée serait exactement cela.
on:
  push:
    branches: ["main", "0*-*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions du gel `docs/versions-gelees.md` — jamais `latest`, jamais un intervalle.
  IMAGE_POSTGRES: postgres:18.4
  IMAGE_REDIS: redis:8.8.1
  NODE_VERSION: 24.18.1
  PNPM_VERSION: 11.18.0
  DATABASE_URL: postgres://kaya_owner:motdepasse_ci@localhost:5432/kaya
  DATABASE_URL_APP: postgres://kaya_app:motdepasse_ci@localhost:5432/kaya
  DATABASE_URL_LEDGER: postgres://kaya_ledger_reader:motdepasse_ci@localhost:5432/kaya

jobs:
  # ---------------------------------------------------------------------------------------------
  #  Périmètre — quels chemins ont changé
  # ---------------------------------------------------------------------------------------------
  perimetre:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filtre.outputs.backend }}
      app: ${{ steps.filtre.outputs.app }}
      gouvernance: ${{ steps.filtre.outputs.gouvernance }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filtre
        run: bash scripts/ci/perimetre.sh

  # ---------------------------------------------------------------------------------------------
  #  Portes documentaires et de gel — s'exécutent TOUJOURS
  # ---------------------------------------------------------------------------------------------
  #  P-02, P-19 et P-20 ne dépendent d'aucune construction : les sauter sur une modification de
  #  documentation laisserait passer une migration réécrite ou une maquette copiée.
  portes-statiques:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: "P-02 — aucune migration appliquée modifiée"
        run: bash scripts/ci/migrations-figees.sh
      - name: "P-04 — aucune jointure entre schémas de modules"
        run: bash scripts/ci/jointures-inter-schemas.sh
      - name: "P-05b — aucun chemin de purge de l'outbox"
        run: bash scripts/ci/outbox-sans-purge.sh
      - name: "P-10 — montants entiers, quantités NUMERIC"
        run: bash scripts/ci/types-monetaires.sh
      - name: "P-19 — aucune maquette copiée sous app/"
        run: bash scripts/ci/maquettes-non-copiees.sh
      - name: "P-20 — versions épinglées exactement"
        run: bash scripts/ci/versions-epinglees.sh

  # ---------------------------------------------------------------------------------------------
  #  Backend — compilation, requêtes vérifiées, tests d'intégration sur base réelle
  # ---------------------------------------------------------------------------------------------
  backend:
    needs: perimetre
    if: needs.perimetre.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: motdepasse_ci
          POSTGRES_DB: kaya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kaya"
          --health-interval 5s --health-timeout 5s --health-retries 20
      cache:
        image: redis:8.8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Le canal exact vient de `backend/rust-toolchain.toml` — rustup le lit tout seul. Aucune
      # version n'est nommée ici : une seconde déclaration dériverait à la première revue.
      - name: Chaîne Rust
        run: rustup show active-toolchain

      # `mold` n'a de sens QUE sur Linux (R-01), et c'est précisément la cible de ce job.
      - name: Installer mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: "Amorcer le rôle propriétaire"
        run: |
          PGPASSWORD=motdepasse_ci psql -h localhost -U postgres -d kaya \
            -v ON_ERROR_STOP=1 -f infra/postgres/init/00-kaya-owner.sql
          PGPASSWORD=motdepasse_ci psql -h localhost -U postgres -d kaya \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE kaya_owner PASSWORD 'motdepasse_ci';"

      - name: "P-18 — cache de requêtes complet"
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
          # Depuis `backend/api` : sqlx-cli cherche `sqlx.toml` dans le répertoire courant, et
          # c'est là qu'il vit. Le lancer depuis `backend/` ferait tenir au CLI et à la macro
          # `sqlx::migrate!()` deux tables de suivi distinctes.
          ( cd backend/api && cargo sqlx migrate run --source ../migrations )
          # `cargo sqlx prepare --workspace --check` NE SUFFIT PAS : il ne collecte pas les
          # requêtes des cibles `[[bin]]`, donc il ne voit pas ce qu'il manque. Le script les
          # ramasse crate par crate — voir son en-tête.
          bash scripts/ci/preparer-sqlx.sh --verifier

      # Ce que la porte P-18 protège réellement : la construction de l'image, qui compile SANS
      # base de données. C'est le seul contexte où un cache incomplet se voit — et c'est ainsi
      # que le trou a été trouvé.
      - name: "Compilation hors ligne, comme l'image de production"
        working-directory: backend
        run: SQLX_OFFLINE=true DATABASE_URL= cargo check --workspace --all-targets --locked

      - name: Compilation
        working-directory: backend
        run: cargo build --workspace --locked

      - name: "Tests — portes P-03, P-05, P-07, P-08, P-12, P-14 et registre hors-ligne"
        working-directory: backend
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------------------------
  #  Contrat d'API et client généré — porte P-01
  # ---------------------------------------------------------------------------------------------
  contrat:
    needs: [perimetre, backend]
    if: needs.perimetre.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: motdepasse_ci
          POSTGRES_DB: kaya
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d kaya"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Amorcer le rôle propriétaire"
        run: |
          PGPASSWORD=motdepasse_ci psql -h localhost -U postgres -d kaya \
            -v ON_ERROR_STOP=1 -f infra/postgres/init/00-kaya-owner.sql
          PGPASSWORD=motdepasse_ci psql -h localhost -U postgres -d kaya \
            -v ON_ERROR_STOP=1 -c "ALTER ROLE kaya_owner PASSWORD 'motdepasse_ci';"
      - name: "P-01 — client TypeScript identique au client commité"
        run: bash scripts/ci/generer-client.sh --verifier

  # ---------------------------------------------------------------------------------------------
  #  Application — portes P-15, P-16, P-17 et file de classe A
  # ---------------------------------------------------------------------------------------------
  app:
    needs: perimetre
    if: needs.perimetre.outputs.app == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "P-16 — parité fr/en, aucune chaîne en dur"
        run: pnpm --filter @kaya/app test:i18n
      - name: "P-17 — aucune couleur ni espacement hors jetons"
        run: pnpm --filter @kaya/app lint:tokens
      - name: "P-15 — aucun @tauri-apps/api hors PlatformAdapter"
        run: pnpm --filter @kaya/app lint
      - name: "P-13 — aucune opération B/C/D dans la file hors ligne"
        run: pnpm --filter @kaya/app test

  # ---------------------------------------------------------------------------------------------
  #  Récapitulatif — les 21 portes de la constitution
  # ---------------------------------------------------------------------------------------------
  #  Un job qui ne fait rien d'autre que refuser de passer au vert si l'un des précédents a
  #  échoué. Il existe pour une raison précise : `needs` seul laisse un job SAUTÉ compter comme
  #  un succès. Sans cette vérification explicite, une demande de fusion dont le job `backend`
  #  aurait été sauté par erreur de filtrage apparaîtrait entièrement verte.
  portes:
    needs: [perimetre, portes-statiques, backend, contrat, app]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Bilan des portes
        run: |
          echo "P-01 client TS identique          → job contrat"
          echo "P-02 migrations figées            → job portes-statiques"
          echo "P-03 hiérarchie des crates        → job backend (tests/architecture.rs)"
          echo "P-04 jointures inter-schémas      → job portes-statiques (heuristique)"
          echo "P-05 événement dans la transaction→ job backend (tests/outbox_transactionnel.rs)"
          echo "P-05b aucune purge du grand livre → job portes-statiques"
          echo "P-06 capacité hors STOCK/SIMPLE   → job backend (à vide, ETB-02b)"
          echo "P-07 RLS ENABLE + FORCE           → job backend (tests/rls_catalogue.rs)"
          echo "P-08 isolation par endpoint       → job backend (tests/isolation_tenant.rs)"
          echo "P-09 occupation en tstzrange      → job backend (à vide, HEB-02)"
          echo "P-10 montants entiers             → job portes-statiques"
          echo "P-11 tests dorés fiscaux          → job backend (à vide, T3)"
          echo "P-12 fiscalité confinée           → job backend (tests/architecture.rs)"
          echo "P-13 file de classe A             → job app"
          echo "P-14 rejeu et désordre            → job backend"
          echo "P-15 pas de __TAURI__ hors adapt. → job app"
          echo "P-16 i18n fr/en                   → job app"
          echo "P-17 jetons de design             → job app"
          echo "P-18 sqlx prepare                 → job backend"
          echo "P-19 maquettes non copiées        → job portes-statiques"
          echo "P-20 versions épinglées           → job portes-statiques"

      - name: Aucun job requis n'a échoué ni été sauté par erreur
        run: |
          echec=0
          for resultat in \
            "portes-statiques=${{ needs.portes-statiques.result }}" \
            "backend=${{ needs.backend.result }}" \
            "contrat=${{ needs.contrat.result }}" \
            "app=${{ needs.app.result }}"; do
              nom="${resultat%%=*}"; etat="${resultat#*=}"
              case "$etat" in
                  success) echo "  ✓ $nom" ;;
                  skipped) echo "  · $nom sauté (filtrage par chemins)" ;;
                  *)       echo "  ✗ $nom : $etat" >&2; echec=1 ;;
              esac
          done
          exit $echec
