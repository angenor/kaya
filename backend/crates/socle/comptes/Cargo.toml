[package]
name = "kaya-comptes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Deux crates de `socle/`, et c'est une arête autorisée par le principe II — `socle/` dépend de
# `socle/` (porte P-03, `backend/tests/architecture.rs`).
#
# `kaya-etablissements` apporte deux choses et rien d'autre : `tenant_context::poser_tenant`, le
# chemin de code le plus sensible du produit — le dupliquer ici en ferait **deux** —, et le trait
# `EstablishmentDirectory`, par lequel l'attribution de rôle vérifie qu'un établissement existe.
# Sans lui, `compte_role.etablissement_id` exigerait une clé étrangère inter-schémas, que le
# principe II interdit et que la porte P-04 refuse.
kaya-etablissements = { path = "../etablissements" }
kaya-synchronisation = { path = "../synchronisation" }

# Les deux crates du gel §3.1 portant la mention « (CPT-01) ». Ce cycle les **active** ; il ne
# choisit aucune version — elles sont épinglées au workspace depuis le cycle 001.
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }

# **Le chiffrement au repos du numéro de pièce d'identité** (FR-012, principe IX, cadrage §12.1).
# Seule dépendance nouvelle du cycle 006 — sa justification complète est au `Cargo.toml` du
# workspace, avec les deux voies écartées. `argon2`, déjà là, dérive la clé par tenant : aucune
# dépendance de dérivation n'est ajoutée.
aes-gcm = { workspace = true }

# Redis porte les sessions. **Il n'est plus optionnel depuis ce cycle** : la liste de révocation
# est consultée à chaque requête authentifiée, c'est le prix de la « coupure immédiate au départ
# d'un employé » du cadrage §12.2. Version épinglée au workspace, comme tout le reste.
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
